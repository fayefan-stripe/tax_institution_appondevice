<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Institution — Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <div id="screen-checkout" class="screen active">
      <h1 class="app-title">Tax Institution</h1>
      <p class="sub-text">Select customer and product</p>

      <label class="field-label" for="customer-search">Customer</label>
      <div class="dropdown-wrap">
        <input
          id="customer-search"
          type="text"
          placeholder="Search by name or email"
          autocomplete="off"
          autocorrect="off"
        >
        <div id="customer-dropdown" class="dropdown-panel" hidden></div>
      </div>
      <p id="customer-selected-hint" class="selected-hint" hidden></p>
      <button id="btn-toggle-create-customer" class="btn btn-secondary">Create new customer</button>
      <div id="create-customer-panel" class="create-panel" hidden>
        <input id="customer-name" type="text" placeholder="Full name" autocomplete="name">
        <input id="customer-email" type="email" placeholder="Email (optional)" autocomplete="email">
        <button id="btn-save-customer" class="btn btn-primary">Save customer</button>
      </div>

      <div class="section-divider"></div>

      <label class="field-label" for="product-search">Product</label>
      <div class="dropdown-wrap">
        <input
          id="product-search"
          type="text"
          placeholder="Search by product name"
          autocomplete="off"
          autocorrect="off"
        >
        <div id="product-dropdown" class="dropdown-panel" hidden></div>
      </div>
      <p id="product-selected-hint" class="selected-hint" hidden></p>
      <button id="btn-toggle-create-product" class="btn btn-secondary">Create new product</button>
      <div id="create-product-panel" class="create-panel" hidden>
        <input id="product-name" type="text" placeholder="Product name">
        <input id="product-amount" type="text" inputmode="decimal" placeholder="Price in AUD (e.g. 8.00)">
        <button id="btn-save-product" class="btn btn-primary">Save product</button>
      </div>

      <div id="checkout-summary" class="summary-card" hidden>
        <p class="summary-label">Ready to charge</p>
        <p id="summary-customer" class="summary-value"></p>
        <p id="summary-product" class="summary-value"></p>
        <p id="summary-amount" class="summary-amount"></p>
      </div>

      <div class="button-group">
        <button id="btn-collect-payment" class="btn btn-primary" disabled>Collect payment on reader</button>
      </div>
    </div>

    <div id="screen-processing" class="screen">
      <div class="spinner"></div>
      <h2>Waiting for card…</h2>
      <p class="sub-text">Please tap, insert, or swipe on the reader.</p>
      <button id="btn-cancel-payment" class="btn btn-secondary">Cancel</button>
    </div>

    <div id="screen-payment-success" class="screen">
      <div class="icon icon-success">✓</div>
      <h2>Payment successful</h2>
      <p id="success-amount" class="sub-text amount"></p>
      <button id="btn-payment-done" class="btn btn-primary">Done</button>
    </div>

    <div id="screen-payment-failed" class="screen">
      <div class="icon icon-error">✗</div>
      <h2>Payment unsuccessful</h2>
      <p class="sub-text">Please try again or contact staff.</p>
      <button id="btn-payment-retry" class="btn btn-primary">Try again</button>
    </div>

  </main>
  <script src="app.js"></script>
</body>
</html>
